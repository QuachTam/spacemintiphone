  <script>
    const sections={
      en:{terms:"Terms",support:"Support",title:"Privacy Policy",date:"Effective November 19, 2026",items:[["Overview","This Privacy Policy explains how My Cleanup handles information when you use the app and related services."],["1. Our approach","My Cleanup is designed to analyze photos, videos, contacts, and duplicate candidates locally on your device. Core on-device cleanup features do not require an account."],["2. Device permissions","Depending on the features you choose, My Cleanup may request access to photos and videos to identify duplicates, similar photos, screenshots, and large media; and contacts to identify possible duplicate or incomplete contacts. You can change permissions in iOS Settings."],["3. Google Drive and Google Photos","If you connect Google, My Cleanup uses Google OAuth and requests limited access for the feature you select. My Cleanup accesses only files or media you explicitly authorize or select. Selected Google media may be downloaded temporarily for analysis, OAuth credentials are stored in iOS Keychain, and My Cleanup does not sell Google user data, use it for advertising, transfer it to data brokers, or automatically delete Google content."],["4. Local data and cache","My Cleanup may store local scan state, media identifiers, hashes, dimensions, category summaries, preferences, and cleanup history so the app can operate efficiently. Temporary cloud downloads are intended to be removed after analysis. Supported scan cache can be cleared from Privacy Center inside the app."],["5. Purchases","Subscriptions and purchases are processed by Apple. My Cleanup may receive entitlement and transaction status needed to unlock paid features, but does not receive your full payment-card information."],["6. Analytics and tracking","My Cleanup uses Google Analytics for Firebase to understand usage and improve the app. Custom events include screen views, permission results, scans, cleanup counts and estimated sizes, and subscription purchase or restore outcomes, including product identifiers. The SDK also processes app-instance and vendor identifiers, device and app information, session activity, and approximate location derived from IP addresses. In-app purchase and subscription events may include product identifiers, names and prices. Analytics does not use GPS or request location permission. Analytics data is sent to Google and may be processed outside your country; it is not limited to data stored on your device. Analytics may operate whether or not you have a subscription. We do not set an Analytics user ID or include photo or contact contents, media identifiers, filenames, cloud URLs, coupon codes or raw error messages in custom events. \n\nThe current iOS app contains no advertising SDK, does not display advertisements or collect the advertising identifier (IDFA), and does not use Crashlytics. Our Analytics property is not linked to Google Ads or AdMob; ads personalization is disabled in all regions and Google products and services data sharing is disabled. We do not use app data to track you across other companies’ apps or websites for targeted advertising or advertising measurement, or share it with data brokers. \n\nAnalytics is not necessarily anonymous merely because the app does not require an account. See <a href=\"https://policies.google.com/privacy\">Google Privacy Policy</a>, <a href=\"https://firebase.google.com/support/privacy\">Firebase privacy information</a> and <a href=\"https://support.google.com/analytics/answer/10285841\">Google Analytics data collection information</a>."],["7. Sharing and disclosure","My Cleanup does not sell personal information. Google processes the Analytics data described above. Our Analytics account also enables aggregated, de-identified measurement contributions for modeling and business insights, technical-support access when needed, and recommendations for our business based on account information. These settings do not authorize us to use your data for cross-company advertising tracking. Information may also be disclosed when required by law, to protect users or the service, or to providers needed to operate a feature, subject to appropriate safeguards."],["8. Retention and deletion","Local app data remains on your device until it is cleared, overwritten, or the app is removed. Disconnecting Google removes the stored OAuth token from My Cleanup. You may also revoke access from your Google Account security settings. Clearing local scan cache or uninstalling the app does not delete usage data already sent to Google. That data is retained according to the applicable Google service and project retention settings. Contact us about data requests; our ability to locate analytics records may be limited because the core app does not require an account."],["9. Children","My Cleanup is not directed to children under 13, or the minimum age required in your jurisdiction, and we do not knowingly collect personal information from children."],["10. Security","We use reasonable technical safeguards, including iOS permission controls and Keychain storage for OAuth credentials. No storage or transmission method can be guaranteed completely secure."],["11. Changes","We may update this policy as My Cleanup evolves. The effective date identifies the latest version."],["12. Contact",'For privacy questions or deletion requests, email <a href="mailto:smartgroup.tq.global@gmail.com">smartgroup.tq.global@gmail.com</a>.']]},
      vi:{terms:"Điều khoản",support:"Hỗ trợ",title:"Chính sách quyền riêng tư",date:"Có hiệu lực từ 19/11/2026",items:[["Tổng quan","Chính sách này giải thích cách My Cleanup xử lý thông tin khi bạn dùng ứng dụng và các dịch vụ liên quan."],["1. Cách tiếp cận","My Cleanup được thiết kế để phân tích ảnh, video, danh bạ và các mục có thể trùng lặp ngay trên thiết bị. Các tính năng dọn dẹp cốt lõi trên thiết bị không yêu cầu tài khoản."],["2. Quyền trên thiết bị","Tùy tính năng bạn dùng, My Cleanup có thể xin quyền truy cập ảnh và video để tìm ảnh trùng, ảnh tương tự, ảnh chụp màn hình và media lớn; và danh bạ để tìm liên hệ trùng hoặc thiếu thông tin. Bạn có thể đổi quyền trong Cài đặt iOS."],["3. Google Drive và Google Photos","Nếu bạn kết nối Google, My Cleanup dùng Google OAuth và chỉ xin quyền giới hạn cho tính năng đã chọn. My Cleanup chỉ truy cập tệp hoặc media bạn cho phép hoặc chọn rõ ràng. Media Google đã chọn có thể được tải tạm thời để phân tích, thông tin OAuth được lưu trong iOS Keychain, và My Cleanup không bán dữ liệu Google, không dùng cho quảng cáo, không chuyển cho data broker, không tự động xóa nội dung Google."],["4. Dữ liệu cục bộ và bộ nhớ đệm","My Cleanup có thể lưu trạng thái quét, mã định danh media, hash, kích thước, tóm tắt danh mục, tùy chọn và lịch sử dọn dẹp trên thiết bị để ứng dụng hoạt động hiệu quả. Tệp cloud tải tạm thời được dự kiến xóa sau phân tích. Có thể xóa cache quét được hỗ trợ trong Privacy Center của ứng dụng."],["5. Mua hàng","Đăng ký và mua hàng do Apple xử lý. My Cleanup có thể nhận trạng thái quyền lợi và giao dịch để mở khóa tính năng trả phí, nhưng không nhận đầy đủ thông tin thẻ thanh toán."],["6. Phân tích và theo dõi","My Cleanup dùng Google Analytics for Firebase để hiểu cách sử dụng và cải thiện ứng dụng. Sự kiện do chúng tôi thêm gồm lượt xem màn hình, kết quả cấp quyền, quét, số lượng và dung lượng ước tính của mục dọn dẹp, kết quả mua hoặc khôi phục đăng ký, bao gồm mã sản phẩm. SDK còn xử lý mã định danh phiên bản cài đặt và nhà cung cấp, thông tin thiết bị và ứng dụng, hoạt động phiên và vị trí gần đúng suy ra từ địa chỉ IP. Sự kiện mua hàng và đăng ký có thể gồm mã, tên và giá sản phẩm. Analytics không dùng GPS hoặc yêu cầu quyền vị trí. Dữ liệu phân tích được gửi tới Google và có thể được xử lý ngoài quốc gia của bạn; dữ liệu này không chỉ nằm trên thiết bị. Analytics có thể hoạt động dù bạn có đăng ký trả phí hay không. Chúng tôi không đặt User ID cho Analytics và không đưa nội dung ảnh hoặc danh bạ, mã định danh media, tên tệp, URL cloud, mã ưu đãi hoặc thông báo lỗi nguyên bản vào sự kiện tùy chỉnh. \n\nApp iOS hiện tại không tích hợp SDK quảng cáo, không hiển thị quảng cáo, không thu thập mã định danh quảng cáo IDFA và không dùng Crashlytics. Property Analytics của chúng tôi không liên kết Google Ads hoặc AdMob; cá nhân hóa quảng cáo được tắt ở mọi khu vực và tùy chọn chia sẻ dữ liệu Google products and services được tắt. Chúng tôi không dùng dữ liệu app để theo dõi bạn giữa ứng dụng hoặc website của các công ty khác nhằm nhắm hoặc đo lường quảng cáo, và không chia sẻ dữ liệu với nhà môi giới dữ liệu. \n\nViệc không yêu cầu tài khoản không có nghĩa mọi dữ liệu Analytics đều ẩn danh. Xem <a href=\"https://policies.google.com/privacy\">Chính sách Google</a>, <a href=\"https://firebase.google.com/support/privacy\">thông tin quyền riêng tư Firebase</a> và <a href=\"https://support.google.com/analytics/answer/10285841\">thông tin thu thập dữ liệu Google Analytics</a>."],["7. Chia sẻ và tiết lộ","My Cleanup không bán thông tin cá nhân. Google xử lý dữ liệu Analytics mô tả ở trên. Tài khoản Analytics của chúng tôi cũng bật đóng góp dữ liệu đo lường đã tổng hợp và loại định danh cho mô hình hóa và thông tin kinh doanh, quyền truy cập của bộ phận hỗ trợ kỹ thuật khi cần, và đề xuất cho doanh nghiệp dựa trên thông tin tài khoản. Các tùy chọn này không cho phép chúng tôi dùng dữ liệu của bạn để theo dõi quảng cáo giữa các công ty. Thông tin cũng có thể được tiết lộ khi pháp luật yêu cầu, để bảo vệ người dùng hoặc dịch vụ, hoặc cho nhà cung cấp cần thiết để vận hành tính năng với biện pháp bảo vệ phù hợp."],["8. Lưu giữ và xóa","Dữ liệu cục bộ nằm trên thiết bị cho đến khi bị xóa, ghi đè hoặc gỡ ứng dụng. Ngắt kết nối Google sẽ xóa OAuth token đã lưu khỏi My Cleanup. Bạn cũng có thể thu hồi quyền trong cài đặt bảo mật Tài khoản Google. Xóa cache quét hoặc gỡ ứng dụng không xóa dữ liệu sử dụng đã gửi tới Google. Dữ liệu này được lưu theo dịch vụ Google và cấu hình lưu giữ của project. Hãy liên hệ về yêu cầu dữ liệu; khả năng xác định bản ghi phân tích có thể hạn chế vì ứng dụng cốt lõi không yêu cầu tài khoản."],["9. Trẻ em","My Cleanup không hướng đến trẻ dưới 13 tuổi hoặc độ tuổi tối thiểu theo khu vực pháp lý, và chúng tôi không cố ý thu thập thông tin cá nhân của trẻ em."],["10. Bảo mật","Chúng tôi dùng các biện pháp kỹ thuật hợp lý, gồm quyền iOS và Keychain cho OAuth. Không có phương thức lưu trữ hoặc truyền tải nào an toàn tuyệt đối."],["11. Thay đổi","Chúng tôi có thể cập nhật chính sách khi My Cleanup phát triển. Ngày hiệu lực cho biết phiên bản mới nhất."],["12. Liên hệ",'Nếu có câu hỏi về quyền riêng tư hoặc yêu cầu xóa dữ liệu, hãy email <a href="mailto:smartgroup.tq.global@gmail.com">smartgroup.tq.global@gmail.com</a>.']]},
      ja:{terms:"利用規約",support:"サポート",title:"プライバシーポリシー",date:"2026年11月19日発効",items:[["概要","本ポリシーは、My Cleanupアプリおよび関連サービス利用時の情報の取り扱いを説明します。"],["1. 基本方針","My Cleanupは、写真、ビデオ、連絡先、重複候補を端末上で分析するよう設計されています。主要な端末内クリーンアップ機能にアカウントは不要です。"],["2. 端末の権限","利用する機能に応じて、My Cleanupは重複、類似写真、スクリーンショット、大きなメディアを見つけるため写真とビデオへのアクセス、また重複または不完全な連絡先を見つけるため連絡先へのアクセスを求める場合があります。権限はiOS設定で変更できます。"],["3. Google DriveとGoogle Photos","Googleを接続する場合、My CleanupはGoogle OAuthを使用し、選択した機能に必要な限定アクセスのみを求めます。明示的に許可または選択したファイルやメディアだけにアクセスします。選択したGoogleメディアは分析のため一時的にダウンロードされることがあり、OAuth認証情報はiOS Keychainに保存されます。My CleanupはGoogleユーザーデータを販売、広告利用、データブローカーへ転送、またはGoogleコンテンツの自動削除を行いません。"],["4. ローカルデータとキャッシュ","My Cleanupは効率的に動作するため、スキャン状態、メディア識別子、ハッシュ、サイズ、カテゴリ概要、設定、クリーンアップ履歴を端末内に保存する場合があります。一時的なクラウドダウンロードは分析後に削除される想定です。対応するスキャンキャッシュはアプリ内のPrivacy Centerから削除できます。"],["5. 購入","サブスクリプションと購入はAppleが処理します。My Cleanupは有料機能の解除に必要な権利と取引状態を受け取る場合がありますが、完全な支払いカード情報は受け取りません。"],["6. 利用状況の分析とトラッキング","My Cleanupは利用状況の把握と改善のためGoogle Analytics for Firebaseを使用します。独自イベントには画面表示、権限の許可結果、スキャン、整理した項目数と推定容量、商品IDを含むサブスクリプション購入・復元の結果が含まれます。SDKはアプリインスタンスとベンダーの識別子、端末・アプリ情報、セッション活動、IPアドレスから推定したおおよその位置も処理します。購入・サブスクリプションイベントには商品ID、商品名、価格が含まれる場合があります。AnalyticsはGPSを使用せず、位置情報の権限を要求しません。分析データはGoogleへ送信され、国外で処理される場合があり、端末内だけに保存されるものではありません。有料サブスクリプションの有無にかかわらずAnalyticsが動作する場合があります。AnalyticsのユーザーIDは設定せず、独自イベントに写真や連絡先の内容、メディア識別子、ファイル名、クラウドURL、クーポンコード、未加工のエラーメッセージを含めません。\n\n現在のiOSアプリは広告SDKを組み込まず、広告を表示せず、広告識別子IDFAを収集せず、Crashlyticsを使用しません。AnalyticsプロパティはGoogle AdsおよびAdMobと連携しておらず、すべての地域で広告のパーソナライズを無効にし、Googleのプロダクトとサービスへのデータ共有も無効にしています。他社のアプリやウェブサイトを横断した広告ターゲティングや広告測定のための追跡にアプリデータを利用せず、データブローカーに共有しません。\n\nアカウントが不要でも分析データがすべて匿名になるわけではありません。<a href=\"https://policies.google.com/privacy\">Googleのプライバシーポリシー</a>、<a href=\"https://firebase.google.com/support/privacy\">Firebaseのプライバシー情報</a>、<a href=\"https://support.google.com/analytics/answer/10285841\">Google Analyticsのデータ収集情報</a>をご確認ください。"],["7. 共有と開示","My Cleanupは個人情報を販売しません。Googleは前述の分析データを処理します。Analyticsアカウントでは、モデリングとビジネス分析のための集計・非識別化された測定データの提供、必要時の技術サポートによるアクセス、アカウント情報に基づくビジネス向けの提案も有効にしています。これらの設定は、他社を横断した広告追跡へのデータ利用を当社に許可するものではありません。法律で求められる場合、ユーザーやサービスの保護のため、または機能提供に必要な事業者に対し、適切な保護措置のもとで情報を開示する場合があります。"],["8. 保持と削除","ローカルアプリデータは、削除、上書き、またはアプリ削除まで端末に残ります。Google接続を解除すると、My Cleanupに保存されたOAuthトークンが削除されます。Googleアカウントのセキュリティ設定からアクセスを取り消すこともできます。 キャッシュ消去やアプリ削除では、Googleに送信済みの利用データは削除されません。保持期間はGoogleのサービスとプロジェクト設定に従います。データに関する依頼はお問い合わせください。主要機能にアカウントが不要なため、分析記録を特定できない場合があります。"],["9. 子ども","My Cleanupは13歳未満、または地域で定められる最低年齢未満の子どもを対象としておらず、子どもの個人情報を意図的に収集しません。"],["10. セキュリティ","iOSの権限制御やOAuth認証情報のKeychain保存など、合理的な技術的保護を使用します。ただし、完全に安全な保存または送信方法はありません。"],["11. 変更","My Cleanupの進化に伴い本ポリシーを更新する場合があります。発効日が最新バージョンを示します。"],["12. 連絡先",'プライバシーに関する質問や削除依頼は <a href="mailto:smartgroup.tq.global@gmail.com">smartgroup.tq.global@gmail.com</a> までご連絡ください。']]},
      "zh-HK":{terms:"條款",support:"支援",title:"私隱政策",date:"2026年11月19日生效",items:[["概覽","本私隱政策說明你使用 My Cleanup 應用程式及相關服務時，My Cleanup 如何處理資料。"],["1. 我們的方式","My Cleanup 設計為在你的裝置上分析相片、影片、聯絡人和可能重複的項目。核心裝置內清理功能不需要帳戶。"],["2. 裝置權限","視乎你使用的功能，My Cleanup 可能要求存取相片和影片，以找出重複、相似相片、螢幕截圖和大型媒體；亦可能要求存取聯絡人，以找出可能重複或資料不完整的聯絡人。你可在 iOS 設定更改權限。"],["3. Google Drive 和 Google Photos","如你連接 Google，My Cleanup 會使用 Google OAuth，並只要求所選功能需要的有限存取權。My Cleanup 只會存取你明確授權或選取的檔案或媒體。選取的 Google 媒體可能會暫時下載作分析，OAuth 憑證會儲存在 iOS Keychain。My Cleanup 不會出售 Google 使用者資料、不會用於廣告、不會轉交資料經紀，亦不會自動刪除 Google 內容。"],["4. 本機資料和快取","My Cleanup 可能在裝置上儲存掃描狀態、媒體識別碼、雜湊、尺寸、分類摘要、偏好設定和清理記錄，以便應用程式有效運作。暫時下載的雲端內容預期會在分析後移除。支援的掃描快取可在應用程式內 Privacy Center 清除。"],["5. 購買","訂閱和購買由 Apple 處理。My Cleanup 可能接收解鎖付費功能所需的權益和交易狀態，但不會收到完整付款卡資料。"],["6. 分析與追蹤","My Cleanup 使用 Google Analytics for Firebase 了解使用情況並改善應用程式。自訂事件包括畫面瀏覽、權限結果、掃描、清理項目數量和估計容量，以及包含產品識別碼的訂閱購買或回復結果。SDK 亦處理應用程式執行個體和供應商識別碼、裝置及應用程式資訊、工作階段活動，以及從 IP 位址推算的大概位置。購買和訂閱事件可能包含產品識別碼、名稱及價格。Analytics 不使用 GPS，也不要求位置權限。分析資料會傳送至 Google，並可能在你所在國家以外處理，並非只儲存在裝置上。不論你是否訂閱付費服務，Analytics 均可能運作。我們不設定 Analytics 使用者 ID，也不在自訂事件中加入相片或聯絡人內容、媒體識別碼、檔案名稱、雲端 URL、優惠碼或原始錯誤訊息。\n\n目前的 iOS 應用程式不整合廣告 SDK、不顯示廣告、不收集廣告識別碼 IDFA，亦不使用 Crashlytics。我們的 Analytics 資源未連結 Google Ads 或 AdMob；所有地區的廣告個人化均已停用，Google 產品和服務的資料分享選項亦已停用。我們不使用應用程式資料跨其他公司的應用程式或網站追蹤你以進行廣告投放或廣告成效衡量，也不向資料經紀分享資料。\n\n不需要帳戶並不代表所有分析資料都是匿名的。詳見 <a href=\"https://policies.google.com/privacy\">Google 私隱政策</a>、<a href=\"https://firebase.google.com/support/privacy\">Firebase 私隱資訊</a>及 <a href=\"https://support.google.com/analytics/answer/10285841\">Google Analytics 資料收集資訊</a>。"],["7. 分享和披露","My Cleanup 不出售個人資料。Google 會處理上述分析資料。我們的 Analytics 帳戶亦啟用了提供已彙總及去識別化的測量資料作建模和業務分析、在需要時由技術支援人員存取，以及根據帳戶資訊提供業務建議。這些設定不代表我們獲准使用你的資料進行跨公司的廣告追蹤。在法律要求、保障使用者或服務，或向營運功能所需的服務提供者披露資料時，我們亦可能在適當保障下分享資訊。"],["8. 保留和刪除","本機 App 資料會保留在裝置上，直到被清除、覆寫或移除 App。斷開 Google 連接會從 My Cleanup 移除已儲存的 OAuth token。你亦可在 Google 帳戶安全設定撤銷存取權。 清除掃描快取或移除應用程式不會刪除已傳送至 Google 的使用資料。保留時間按 Google 服務及專案設定而定。資料請求可聯絡我們；由於核心功能不需要帳戶，我們可能無法識別相關分析記錄。"],["9. 兒童","My Cleanup 並非面向13歲以下，或相關司法管轄區最低年齡以下的兒童，且我們不會在知情的情況下收集兒童個人資料。"],["10. 安全","我們使用合理技術保障，包括 iOS 權限控制和以 Keychain 儲存 OAuth 憑證。任何儲存或傳輸方式都不能保證完全安全。"],["11. 變更","隨著 My Cleanup 發展，我們可能更新本政策。頁首生效日期代表最新版本。"],["12. 聯絡",'如有私隱問題或刪除要求，請電郵 <a href="mailto:smartgroup.tq.global@gmail.com">smartgroup.tq.global@gmail.com</a>。']]}
    };
    const pick=()=>{if(localStorage.spacemintLang)return localStorage.spacemintLang;const lang=(navigator.language||"").toLowerCase();if(lang.startsWith("vi"))return"vi";if(lang.startsWith("ja"))return"ja";if(lang.startsWith("zh"))return"zh-HK";return"en"};
    function textBlocks(text){return text.split("\n\n").filter(Boolean).map(x=>`<p>${x}</p>`).join("")}
    function render(lang=pick()){const t=sections[lang]||sections.en;document.documentElement.lang=lang;localStorage.spacemintLang=lang;document.querySelectorAll("[data-i]").forEach(e=>e.textContent=t[e.dataset.i]);document.querySelectorAll("[data-lang]").forEach(b=>b.classList.toggle("active",b.dataset.lang===lang));document.getElementById("content").innerHTML=t.items.map(([h,p],i)=>`${i?`<h2>${h}</h2>`:""}${textBlocks(p)}`).join("")}
    document.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>render(b.dataset.lang));render();
  </script>
</body>
</html>
