  <script>
    const sections={
      en:{terms:"Terms",support:"Support",title:"Privacy Policy",date:"Effective September 9, 2026",items:[["Overview","This Privacy Policy explains how ClearNest handles information when you use the app and related services."],["1. Our approach","ClearNest is designed to analyze photos, videos, contacts, and duplicate candidates locally on your device. Core on-device cleanup features do not require an account."],["2. Device permissions","Depending on the features you choose, ClearNest may request access to photos and videos to identify duplicates, similar photos, screenshots, and large media; and contacts to identify possible duplicate or incomplete contacts. You can change permissions in iOS Settings."],["3. Google Drive and Google Photos","If you connect Google, ClearNest uses Google OAuth and requests limited access for the feature you select. ClearNest accesses only files or media you explicitly authorize or select. Selected Google media may be downloaded temporarily for analysis, OAuth credentials are stored in iOS Keychain, and ClearNest does not sell Google user data, use it for advertising, transfer it to data brokers, or automatically delete Google content."],["4. Local data and cache","ClearNest may store local scan state, media identifiers, hashes, dimensions, category summaries, preferences, and cleanup history so the app can operate efficiently. Temporary cloud downloads are intended to be removed after analysis. Supported scan cache can be cleared from Privacy Center inside the app."],["5. Purchases","Subscriptions and purchases are processed by Apple. ClearNest may receive entitlement and transaction status needed to unlock paid features, but does not receive your full payment-card information."],["6. Analytics, advertising, and tracking","ClearNest uses Google Analytics for Firebase to understand app usage and improve features. It records screen views and actions such as permission requests, scans, cleanup counts, purchase outcomes and coin rewards, alongside SDK data such as app-instance identifiers, device and app information, and session activity. Usage data is sent to Google and may be processed outside your country. Analytics operates independently of whether you watch ads or buy Pro. We do not include photo or contact contents, media identifiers, cloud URLs, coupon codes or raw error messages in our custom analytics events. ClearNest offers Pro through Apple in-app purchases; optional Google AdMob rewarded ads are an alternative for earning scan coins. Ads play when you choose to watch them. Google and its advertising partners may process IP addresses, device identifiers and information, ad interactions, diagnostics and local storage to deliver and measure ads and prevent fraud. Photos, contacts and Google account content are not shared with advertisers. Consent messages are shown when required, and ad privacy options appear in Settings when required. These ad options do not turn off Firebase Analytics. See <a href=\"https://policies.google.com/privacy\">Google Privacy Policy</a> and <a href=\"https://firebase.google.com/support/privacy\">Firebase privacy information</a>. Coins and scan reservations are stored locally in iOS Keychain, do not sync between devices, and may remain after reinstalling the app."],["7. Sharing and disclosure","ClearNest does not sell personal information. Information may be disclosed when required by law, to protect users or the service, or to service providers strictly necessary to operate a feature and subject to safeguards."],["8. Retention and deletion","Local app data remains on your device until it is cleared, overwritten, or the app is removed. Disconnecting Google removes the stored OAuth token from ClearNest. You may also revoke access from your Google Account security settings. Clearing local scan cache or uninstalling the app does not delete usage data already sent to Google. That data is retained according to the applicable Google service and project retention settings. Contact us about data requests; our ability to locate analytics records may be limited because the core app does not require an account."],["9. Children","ClearNest is not directed to children under 13, or the minimum age required in your jurisdiction, and we do not knowingly collect personal information from children."],["10. Security","We use reasonable technical safeguards, including iOS permission controls and Keychain storage for OAuth credentials. No storage or transmission method can be guaranteed completely secure."],["11. Changes","We may update this policy as ClearNest evolves. The effective date identifies the latest version."],["12. Contact",'For privacy questions or deletion requests, email <a href="mailto:smartgroup.tq.global@gmail.com">smartgroup.tq.global@gmail.com</a>.']]},
      vi:{terms:"Điều khoản",support:"Hỗ trợ",title:"Chính sách quyền riêng tư",date:"Có hiệu lực từ 09/09/2026",items:[["Tổng quan","Chính sách này giải thích cách ClearNest xử lý thông tin khi bạn dùng ứng dụng và các dịch vụ liên quan."],["1. Cách tiếp cận","ClearNest được thiết kế để phân tích ảnh, video, danh bạ và các mục có thể trùng lặp ngay trên thiết bị. Các tính năng dọn dẹp cốt lõi trên thiết bị không yêu cầu tài khoản."],["2. Quyền trên thiết bị","Tùy tính năng bạn dùng, ClearNest có thể xin quyền truy cập ảnh và video để tìm ảnh trùng, ảnh tương tự, ảnh chụp màn hình và media lớn; và danh bạ để tìm liên hệ trùng hoặc thiếu thông tin. Bạn có thể đổi quyền trong Cài đặt iOS."],["3. Google Drive và Google Photos","Nếu bạn kết nối Google, ClearNest dùng Google OAuth và chỉ xin quyền giới hạn cho tính năng đã chọn. ClearNest chỉ truy cập tệp hoặc media bạn cho phép hoặc chọn rõ ràng. Media Google đã chọn có thể được tải tạm thời để phân tích, thông tin OAuth được lưu trong iOS Keychain, và ClearNest không bán dữ liệu Google, không dùng cho quảng cáo, không chuyển cho data broker, không tự động xóa nội dung Google."],["4. Dữ liệu cục bộ và bộ nhớ đệm","ClearNest có thể lưu trạng thái quét, mã định danh media, hash, kích thước, tóm tắt danh mục, tùy chọn và lịch sử dọn dẹp trên thiết bị để ứng dụng hoạt động hiệu quả. Tệp cloud tải tạm thời được dự kiến xóa sau phân tích. Có thể xóa cache quét được hỗ trợ trong Privacy Center của ứng dụng."],["5. Mua hàng","Đăng ký và mua hàng do Apple xử lý. ClearNest có thể nhận trạng thái quyền lợi và giao dịch để mở khóa tính năng trả phí, nhưng không nhận đầy đủ thông tin thẻ thanh toán."],["6. Phân tích, quảng cáo và tracking","ClearNest dùng Google Analytics for Firebase để hiểu cách sử dụng ứng dụng và cải thiện tính năng. Dữ liệu gồm lượt xem màn hình, yêu cầu quyền, quét, số lượng mục dọn dẹp, kết quả mua hàng, thưởng coin, cùng mã định danh phiên bản cài đặt, thông tin thiết bị và ứng dụng, hoạt động phiên do SDK thu thập. Dữ liệu sử dụng được gửi tới Google và có thể được xử lý ngoài quốc gia của bạn. Analytics hoạt động độc lập với việc xem quảng cáo hoặc mua Pro. Sự kiện phân tích do chúng tôi thêm không chứa nội dung ảnh hoặc danh bạ, mã định danh media, URL cloud, mã ưu đãi hay thông báo lỗi nguyên bản. ClearNest cung cấp Pro qua mua hàng trong ứng dụng của Apple; quảng cáo nhận thưởng Google AdMob là phương án tự chọn để kiếm coin quét. Quảng cáo phát khi bạn chọn xem. Google và đối tác quảng cáo có thể xử lý địa chỉ IP, mã định danh và thông tin thiết bị, tương tác quảng cáo, dữ liệu chẩn đoán và bộ nhớ cục bộ để phân phối, đo lường quảng cáo và chống gian lận. Ảnh, danh bạ và nội dung tài khoản Google không được chia sẻ với nhà quảng cáo. Thông báo đồng ý và tùy chọn quyền riêng tư quảng cáo trong Cài đặt được cung cấp khi được yêu cầu. Các tùy chọn quảng cáo này không tắt Firebase Analytics. Xem <a href=\"https://policies.google.com/privacy\">Chính sách Google</a> và <a href=\"https://firebase.google.com/support/privacy\">quyền riêng tư Firebase</a>. Coin và trạng thái giữ coin khi quét lưu trong iOS Keychain, không đồng bộ giữa thiết bị và có thể còn sau khi cài lại ứng dụng."],["7. Chia sẻ và tiết lộ","ClearNest không bán thông tin cá nhân. Thông tin có thể được tiết lộ khi pháp luật yêu cầu, để bảo vệ người dùng hoặc dịch vụ, hoặc cho nhà cung cấp cần thiết để vận hành tính năng và có biện pháp bảo vệ phù hợp."],["8. Lưu giữ và xóa","Dữ liệu cục bộ nằm trên thiết bị cho đến khi bị xóa, ghi đè hoặc gỡ ứng dụng. Ngắt kết nối Google sẽ xóa OAuth token đã lưu khỏi ClearNest. Bạn cũng có thể thu hồi quyền trong cài đặt bảo mật Tài khoản Google. Xóa cache quét hoặc gỡ ứng dụng không xóa dữ liệu sử dụng đã gửi tới Google. Dữ liệu này được lưu theo dịch vụ Google và cấu hình lưu giữ của project. Hãy liên hệ về yêu cầu dữ liệu; khả năng xác định bản ghi phân tích có thể hạn chế vì ứng dụng cốt lõi không yêu cầu tài khoản."],["9. Trẻ em","ClearNest không hướng đến trẻ dưới 13 tuổi hoặc độ tuổi tối thiểu theo khu vực pháp lý, và chúng tôi không cố ý thu thập thông tin cá nhân của trẻ em."],["10. Bảo mật","Chúng tôi dùng các biện pháp kỹ thuật hợp lý, gồm quyền iOS và Keychain cho OAuth. Không có phương thức lưu trữ hoặc truyền tải nào an toàn tuyệt đối."],["11. Thay đổi","Chúng tôi có thể cập nhật chính sách khi ClearNest phát triển. Ngày hiệu lực cho biết phiên bản mới nhất."],["12. Liên hệ",'Nếu có câu hỏi về quyền riêng tư hoặc yêu cầu xóa dữ liệu, hãy email <a href="mailto:smartgroup.tq.global@gmail.com">smartgroup.tq.global@gmail.com</a>.']]},
      ja:{terms:"利用規約",support:"サポート",title:"プライバシーポリシー",date:"2026年9月9日発効",items:[["概要","本ポリシーは、ClearNestアプリおよび関連サービス利用時の情報の取り扱いを説明します。"],["1. 基本方針","ClearNestは、写真、ビデオ、連絡先、重複候補を端末上で分析するよう設計されています。主要な端末内クリーンアップ機能にアカウントは不要です。"],["2. 端末の権限","利用する機能に応じて、ClearNestは重複、類似写真、スクリーンショット、大きなメディアを見つけるため写真とビデオへのアクセス、また重複または不完全な連絡先を見つけるため連絡先へのアクセスを求める場合があります。権限はiOS設定で変更できます。"],["3. Google DriveとGoogle Photos","Googleを接続する場合、ClearNestはGoogle OAuthを使用し、選択した機能に必要な限定アクセスのみを求めます。明示的に許可または選択したファイルやメディアだけにアクセスします。選択したGoogleメディアは分析のため一時的にダウンロードされることがあり、OAuth認証情報はiOS Keychainに保存されます。ClearNestはGoogleユーザーデータを販売、広告利用、データブローカーへ転送、またはGoogleコンテンツの自動削除を行いません。"],["4. ローカルデータとキャッシュ","ClearNestは効率的に動作するため、スキャン状態、メディア識別子、ハッシュ、サイズ、カテゴリ概要、設定、クリーンアップ履歴を端末内に保存する場合があります。一時的なクラウドダウンロードは分析後に削除される想定です。対応するスキャンキャッシュはアプリ内のPrivacy Centerから削除できます。"],["5. 購入","サブスクリプションと購入はAppleが処理します。ClearNestは有料機能の解除に必要な権利と取引状態を受け取る場合がありますが、完全な支払いカード情報は受け取りません。"],["6. 分析、広告、トラッキング","ClearNestは機能改善と利用状況の把握にGoogle Analytics for Firebaseを使用します。画面表示、権限リクエスト、スキャン、削除件数、購入結果、コイン報酬に加え、SDKがアプリインスタンス識別子、端末・アプリ情報、セッション活動を収集します。利用データはGoogleへ送信され、国外で処理される場合があります。Analyticsは広告視聴やPro購入とは独立して動作します。独自イベントに写真や連絡先の内容、メディア識別子、クラウドURL、クーポンコード、未加工のエラー文を含めません。ProはAppleのアプリ内購入で提供し、Google AdMobの任意のリワード広告はスキャン用コインを得る代替手段です。広告は視聴を選択した場合に再生されます。Googleと広告パートナーは広告配信、測定、不正防止のためIPアドレス、端末識別子・情報、広告操作、診断情報、ローカルストレージを処理する場合があります。写真、連絡先、Googleアカウントのコンテンツは広告主に共有しません。必要な場合は同意画面と設定内の広告プライバシーオプションを提供します。これらの広告設定はFirebase Analyticsを停止しません。<a href=\"https://policies.google.com/privacy\">Googleのポリシー</a>と<a href=\"https://firebase.google.com/support/privacy\">Firebaseのプライバシー情報</a>をご確認ください。コインと予約状態はiOS Keychainに保存され、端末間で同期されず、再インストール後も残る場合があります。"],["7. 共有と開示","ClearNestは個人情報を販売しません。法律で求められる場合、ユーザーやサービス保護のため、または機能提供に必要なサービス提供者に対し、適切な保護措置のもとで情報を開示する場合があります。"],["8. 保持と削除","ローカルアプリデータは、削除、上書き、またはアプリ削除まで端末に残ります。Google接続を解除すると、ClearNestに保存されたOAuthトークンが削除されます。Googleアカウントのセキュリティ設定からアクセスを取り消すこともできます。 キャッシュ消去やアプリ削除では、Googleに送信済みの利用データは削除されません。保持期間はGoogleのサービスとプロジェクト設定に従います。データに関する依頼はお問い合わせください。主要機能にアカウントが不要なため、分析記録を特定できない場合があります。"],["9. 子ども","ClearNestは13歳未満、または地域で定められる最低年齢未満の子どもを対象としておらず、子どもの個人情報を意図的に収集しません。"],["10. セキュリティ","iOSの権限制御やOAuth認証情報のKeychain保存など、合理的な技術的保護を使用します。ただし、完全に安全な保存または送信方法はありません。"],["11. 変更","ClearNestの進化に伴い本ポリシーを更新する場合があります。発効日が最新バージョンを示します。"],["12. 連絡先",'プライバシーに関する質問や削除依頼は <a href="mailto:smartgroup.tq.global@gmail.com">smartgroup.tq.global@gmail.com</a> までご連絡ください。']]},
      "zh-HK":{terms:"條款",support:"支援",title:"私隱政策",date:"2026年9月9日生效",items:[["概覽","本私隱政策說明你使用 ClearNest 應用程式及相關服務時，ClearNest 如何處理資料。"],["1. 我們的方式","ClearNest 設計為在你的裝置上分析相片、影片、聯絡人和可能重複的項目。核心裝置內清理功能不需要帳戶。"],["2. 裝置權限","視乎你使用的功能，ClearNest 可能要求存取相片和影片，以找出重複、相似相片、螢幕截圖和大型媒體；亦可能要求存取聯絡人，以找出可能重複或資料不完整的聯絡人。你可在 iOS 設定更改權限。"],["3. Google Drive 和 Google Photos","如你連接 Google，ClearNest 會使用 Google OAuth，並只要求所選功能需要的有限存取權。ClearNest 只會存取你明確授權或選取的檔案或媒體。選取的 Google 媒體可能會暫時下載作分析，OAuth 憑證會儲存在 iOS Keychain。ClearNest 不會出售 Google 使用者資料、不會用於廣告、不會轉交資料經紀，亦不會自動刪除 Google 內容。"],["4. 本機資料和快取","ClearNest 可能在裝置上儲存掃描狀態、媒體識別碼、雜湊、尺寸、分類摘要、偏好設定和清理記錄，以便應用程式有效運作。暫時下載的雲端內容預期會在分析後移除。支援的掃描快取可在應用程式內 Privacy Center 清除。"],["5. 購買","訂閱和購買由 Apple 處理。ClearNest 可能接收解鎖付費功能所需的權益和交易狀態，但不會收到完整付款卡資料。"],["6. 分析、廣告和追蹤","ClearNest 使用 Google Analytics for Firebase 了解使用情況並改善功能，記錄畫面瀏覽、權限請求、掃描、清理數量、購買結果及金幣獎勵，以及 SDK 收集的應用程式執行個體識別碼、裝置與應用程式資訊和工作階段活動。使用資料會傳送至 Google，並可能在你所在國家以外處理。Analytics 運作不取決於你是否觀看廣告或購買 Pro。我們新增的分析事件不包含相片或聯絡人內容、媒體識別碼、雲端 URL、優惠碼或原始錯誤訊息。Pro 透過 Apple App 內購買提供；Google AdMob 自選獎勵廣告是賺取掃描金幣的替代方式。廣告只在你選擇觀看時播放。Google 及廣告合作夥伴可能處理 IP 位址、裝置識別碼與資訊、廣告互動、診斷資料及本機儲存，以投放及衡量廣告和防止詐騙。相片、聯絡人及 Google 帳戶內容不會分享給廣告商。我們在需要時提供同意訊息及設定內的廣告私隱選項。這些廣告選項不會關閉 Firebase Analytics。詳見 <a href=\"https://policies.google.com/privacy\">Google 私隱政策</a>及 <a href=\"https://firebase.google.com/support/privacy\">Firebase 私隱資料</a>。金幣及掃描預留狀態儲存在 iOS Keychain，不會跨裝置同步，重新安裝後可能仍然保留。"],["7. 分享和披露","ClearNest 不會出售個人資料。資料可能會在法律要求、保護使用者或服務，或向營運功能所必需且受保障措施約束的服務提供者披露。"],["8. 保留和刪除","本機 App 資料會保留在裝置上，直到被清除、覆寫或移除 App。斷開 Google 連接會從 ClearNest 移除已儲存的 OAuth token。你亦可在 Google 帳戶安全設定撤銷存取權。 清除掃描快取或移除應用程式不會刪除已傳送至 Google 的使用資料。保留時間按 Google 服務及專案設定而定。資料請求可聯絡我們；由於核心功能不需要帳戶，我們可能無法識別相關分析記錄。"],["9. 兒童","ClearNest 並非面向13歲以下，或相關司法管轄區最低年齡以下的兒童，且我們不會 knowingly 收集兒童個人資料。"],["10. 安全","我們使用合理技術保障，包括 iOS 權限控制和以 Keychain 儲存 OAuth 憑證。任何儲存或傳輸方式都不能保證完全安全。"],["11. 變更","隨著 ClearNest 發展，我們可能更新本政策。頁首生效日期代表最新版本。"],["12. 聯絡",'如有私隱問題或刪除要求，請電郵 <a href="mailto:smartgroup.tq.global@gmail.com">smartgroup.tq.global@gmail.com</a>。']]}
    };
    const pick=()=>{if(localStorage.spacemintLang)return localStorage.spacemintLang;const lang=(navigator.language||"").toLowerCase();if(lang.startsWith("vi"))return"vi";if(lang.startsWith("ja"))return"ja";if(lang.startsWith("zh"))return"zh-HK";return"en"};
    function textBlocks(text){return text.split(/(?<=\\.)\\s+|(?<=。)/).filter(Boolean).map(x=>`<p>${x}</p>`).join("")}
    function render(lang=pick()){const t=sections[lang]||sections.en;document.documentElement.lang=lang;localStorage.spacemintLang=lang;document.querySelectorAll("[data-i]").forEach(e=>e.textContent=t[e.dataset.i]);document.querySelectorAll("[data-lang]").forEach(b=>b.classList.toggle("active",b.dataset.lang===lang));document.getElementById("content").innerHTML=t.items.map(([h,p],i)=>`${i?`<h2>${h}</h2>`:""}${textBlocks(p)}`).join("")}
    document.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>render(b.dataset.lang));render();
  </script>
</body>
