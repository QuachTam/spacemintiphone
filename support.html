<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Get help with ClearNest">
  <title>Support — ClearNest</title>
  <style>
    :root{color-scheme:dark;--bg:#08081d;--mint:#68f3c3;--text:#f5f5ff;--muted:#bdbdd3;--line:#ffffff14;--panel:#ffffff09}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#2b2868,var(--bg) 450px);color:var(--text);font:16px/1.65 system-ui,-apple-system,sans-serif}.wrap{width:min(900px,calc(100% - 38px));margin:auto}nav{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:24px 0}a{color:var(--mint)}nav a{color:var(--muted);text-decoration:none}.brand{color:#fff;font-size:20px;font-weight:800}.navlinks{display:flex;gap:16px}.lang{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.lang button{border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--muted);padding:8px 12px;font:inherit;cursor:pointer}.lang button.active{background:var(--mint);color:#101026;font-weight:800}.hero{text-align:center;padding:42px 0}.hero h1{font-size:clamp(40px,8vw,64px);letter-spacing:-.04em;margin:0 0 12px}.hero p{color:var(--muted);font-size:19px}.button{display:inline-block;margin-top:16px;padding:13px 20px;border-radius:999px;background:linear-gradient(90deg,var(--mint),#9b8cff);color:#101026;text-decoration:none;font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:18px 0 60px}.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:24px}.card h2{font-size:19px;margin:0 0 8px}.card p{color:var(--muted);margin:0}footer{padding:28px 0 40px;border-top:1px solid var(--line);color:var(--muted);font-size:14px}@media(max-width:650px){.grid{grid-template-columns:1fr}nav{align-items:flex-start}.navlinks{font-size:14px;gap:10px}}
  </style>
</head>
<body>
  <div class="wrap">
    <nav>
      <a class="brand" href="index.html">ClearNest</a>
      <div class="navlinks"><a href="privacy.html" data-i="privacy">Privacy</a><a href="terms.html" data-i="terms">Terms</a></div>
    </nav>
    <div class="lang" aria-label="Language">
      <button data-lang="en">English</button><button data-lang="vi">Tiếng Việt</button><button data-lang="ja">日本語</button><button data-lang="zh-HK">繁體中文</button>
    </div>
    <main>
      <section class="hero">
        <h1 data-i="title">How can we help?</h1>
        <p data-i="subtitle">Tell us what happened and we’ll help you get ClearNest back on track.</p>
        <a class="button" href="mailto:smartgroup.tq.global@gmail.com?subject=ClearNest%20Support" data-i="email">Email Support</a>
      </section>
      <section class="grid" id="cards"></section>
    </main>
    <footer>© 2026 ClearNest. All rights reserved.</footer>
  </div>
  <script>
    const L={en:{privacy:"Privacy",terms:"Terms",title:"How can we help?",subtitle:"Tell us what happened and we'll help you get ClearNest back on track.",email:"Email Support",cards:[["Pro and optional ads", "Upgrade to Pro through Apple in-app purchase for scans without spending coins. If you prefer, choose a rewarded ad to earn the number of coins shown in the app. Watching ads is optional."], ["Ad unavailable or reward missing", "An internet connection and ad availability are required. Coins are awarded after the ad provider confirms the reward; closing early may not earn coins. If an ad is unavailable, try later or choose Pro. For a missing reward, contact support with the approximate time and app version. Do not send private photos or contacts."], ["Ad privacy and coins", "Ad privacy options appear in Settings when required. Coins stay on this device, do not sync and cannot be restored through Restore Purchases. The Privacy Policy explains AdMob and Firebase Analytics."],["Photos permission","Open iOS Settings -> ClearNest -> Photos and choose the level of access you want to provide."],["Contacts permission","Open iOS Settings -> ClearNest -> Contacts if contact cleanup cannot scan."],["Restore purchases","Open ClearNest Settings and select Restore Purchases while signed in to the Apple Account used for the purchase."],["Cancel a subscription","Manage subscriptions from iOS Settings -> Apple Account -> Subscriptions. Billing is handled by Apple."],["Deleting content","Review every suggested item before deletion. ClearNest asks for confirmation before deleting local media."],["Keep Safe items","Items marked Keep Safe can be managed from ClearNest Settings -> Keep Safe Items."],["Cleanup history","Open ClearNest Settings -> Cleanup History to review or clear previous cleanup sessions."],["Contact backups","Contact merge and removal backups are available from ClearNest Settings -> Contact Backups."]]},
    vi:{privacy:"Quyền riêng tư",terms:"Điều khoản",title:"Bạn cần hỗ trợ gì?",subtitle:"Hãy cho chúng tôi biết vấn đề và chúng tôi sẽ giúp bạn dùng ClearNest ổn định lại.",email:"Email hỗ trợ",cards:[["Pro và quảng cáo tự chọn", "Nâng cấp Pro qua mua hàng trong ứng dụng của Apple để quét không tốn coin. Nếu muốn, bạn có thể xem quảng cáo nhận thưởng để kiếm số coin hiển thị trong app. Xem quảng cáo không bắt buộc."], ["Không có quảng cáo hoặc chưa nhận coin", "Cần kết nối internet và quảng cáo khả dụng. Coin được cộng khi nhà cung cấp xác nhận thưởng; đóng sớm có thể không nhận coin. Nếu chưa có quảng cáo, thử lại sau hoặc chọn Pro. Nếu thiếu thưởng, liên hệ hỗ trợ kèm thời điểm gần đúng và phiên bản app; không gửi ảnh hay danh bạ riêng tư."], ["Quyền riêng tư quảng cáo và coin", "Tùy chọn quyền riêng tư quảng cáo xuất hiện trong Cài đặt khi được yêu cầu. Coin lưu trên thiết bị, không đồng bộ và không thể khôi phục qua Khôi phục mua hàng. Chính sách quyền riêng tư giải thích AdMob và Firebase Analytics."],["Quyền truy cập Ảnh","Mở Cài đặt iOS -> ClearNest -> Ảnh và chọn mức truy cập bạn muốn cấp."],["Quyền truy cập Danh bạ","Mở Cài đặt iOS -> ClearNest -> Danh bạ nếu tính năng dọn dẹp danh bạ không quét được."],["Khôi phục mua hàng","Mở Cài đặt trong ClearNest và chọn Khôi phục mua hàng bằng đúng Tài khoản Apple đã mua."],["Hủy đăng ký","Quản lý đăng ký trong Cài đặt iOS -> Tài khoản Apple -> Đăng ký. Apple xử lý thanh toán."],["Xóa nội dung","Hãy xem lại từng mục được gợi ý trước khi xóa. ClearNest luôn hỏi xác nhận trước khi xóa media cục bộ."],["Mục Keep Safe","Các mục đã đánh dấu Keep Safe có thể quản lý trong Cài đặt ClearNest -> Mục Keep Safe."],["Lịch sử dọn dẹp","Mở Cài đặt ClearNest -> Lịch sử dọn dẹp để xem hoặc xóa các phiên dọn dẹp trước."],["Sao lưu danh bạ","Bản sao lưu khi gộp hoặc xóa danh bạ nằm trong Cài đặt ClearNest -> Sao lưu danh bạ."]]},
    ja:{privacy:"プライバシー",terms:"利用規約",title:"どのようなサポートが必要ですか？",subtitle:"問題の内容をお知らせください。ClearNestを再び快適に使えるようサポートします。",email:"サポートへメール",cards:[["Proと任意の広告", "Appleのアプリ内購入でProにアップグレードすると、コインを使わずスキャンできます。代わりに任意のリワード広告を視聴し、表示されたコインを獲得することもできます。広告視聴は必須ではありません。"], ["広告や報酬の問題", "インターネット接続と広告の在庫が必要です。広告提供者が報酬を確認した後にコインを付与します。途中で閉じると付与されない場合があります。広告がない場合は後で再試行するかProを選択してください。報酬がない場合は時刻とアプリのバージョンを添えてご連絡ください。個人の写真や連絡先は送らないでください。"], ["広告設定とコイン", "必要な場合、設定に広告プライバシーオプションが表示されます。コインは端末内に保存され、同期や購入の復元には対応しません。AdMobとFirebase Analyticsについてはプライバシーポリシーをご覧ください。"],["写真の権限","iOS設定 -> ClearNest -> 写真を開き、許可するアクセス範囲を選んでください。"],["連絡先の権限","連絡先クリーンアップをスキャンできない場合は、iOS設定 -> ClearNest -> 連絡先を確認してください。"],["購入の復元","購入時のApple Accountでサインインした状態で、ClearNest設定から購入を復元してください。"],["サブスクリプションの解約","iOS設定 -> Apple Account -> サブスクリプションで管理します。請求はAppleが処理します。"],["コンテンツの削除","削除前に候補を必ず確認してください。ローカルメディアの削除前にはClearNestが確認を表示します。"],["Keep Safe項目","Keep Safeにした項目はClearNest設定 -> Keep Safe項目で管理できます。"],["クリーンアップ履歴","ClearNest設定 -> クリーンアップ履歴で過去のセッションを確認または消去できます。"],["連絡先バックアップ","連絡先の結合や削除のバックアップはClearNest設定 -> 連絡先バックアップで確認できます。"]]},
    "zh-HK":{privacy:"私隱",terms:"條款",title:"有甚麼可以幫你？",subtitle:"告訴我們發生了甚麼事，我們會協助你讓 ClearNest 回復正常。",email:"電郵支援",cards:[["Pro 與自選廣告", "透過 Apple App 內購買升級 Pro，即可掃描而毋須花費金幣。你也可選擇觀看獎勵廣告，賺取應用程式顯示的金幣數量。觀看廣告並非必要。"], ["沒有廣告或未收到獎勵", "需要網絡連線及可用廣告。廣告供應商確認獎勵後才會發放金幣；提早關閉可能無法獲得金幣。如沒有廣告，可稍後再試或選擇 Pro。未收到獎勵時，請提供大約時間及應用程式版本聯絡支援，毋須傳送私人相片或聯絡人。"], ["廣告私隱與金幣", "需要時可在設定找到廣告私隱選項。金幣只儲存在此裝置，不會同步，亦不能透過恢復購買還原。私隱政策說明 AdMob 及 Firebase Analytics。"],["相片權限","開啟 iOS 設定 -> ClearNest -> 相片，選擇你想提供的存取權限。"],["聯絡人權限","如果聯絡人清理無法掃描，請開啟 iOS 設定 -> ClearNest -> 聯絡人。"],["恢復購買","使用購買時的 Apple Account 登入，然後在 ClearNest 設定選擇恢復購買。"],["取消訂閱","在 iOS 設定 -> Apple Account -> 訂閱中管理。付款由 Apple 處理。"],["刪除內容","刪除前請逐項檢查建議內容。ClearNest 刪除本機媒體前一定會要求確認。"],["Keep Safe 項目","標記為 Keep Safe 的項目可在 ClearNest 設定 -> Keep Safe 項目中管理。"],["清理記錄","開啟 ClearNest 設定 -> 清理記錄，可查看或清除之前的清理工作。"],["聯絡人備份","合併或移除聯絡人的備份可在 ClearNest 設定 -> 聯絡人備份中查看。"]]}};
    const pick=()=>{if(localStorage.spacemintLang)return localStorage.spacemintLang;const lang=(navigator.language||"").toLowerCase();if(lang.startsWith("vi"))return"vi";if(lang.startsWith("ja"))return"ja";if(lang.startsWith("zh"))return"zh-HK";return"en"};
    function render(lang=pick()){const t=L[lang]||L.en;document.documentElement.lang=lang;localStorage.spacemintLang=lang;document.querySelectorAll("[data-i]").forEach(e=>e.textContent=t[e.dataset.i]);document.querySelectorAll("[data-lang]").forEach(b=>b.classList.toggle("active",b.dataset.lang===lang));document.getElementById("cards").innerHTML=t.cards.map(([h,p])=>`<article class="card"><h2>${h}</h2><p>${p}</p></article>`).join("")}
    document.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>render(b.dataset.lang));render();
  </script>
</body>
</html>
